# gitleaks 設定
# 既定ルールセット (gitleaks 同梱の default) を継承し、本リポジトリ固有の allowlist を追加する。
[extend]
useDefault = true

[[allowlists]]
description = "テストファイル / テスト設定内のダミー機密 (アクセストークン・private key 等) は本物の機密ではないため除外"
paths = [
	# テスト用 setup / fixture ディレクトリ配下
	'''^apps/backend/.*/test/''',
	'''^apps/frontend/.*/test/''',
	# vitest 設定ファイル (現行パス apps/backend/, リネーム前パス apps/api/)
	'''^apps/backend/vitest(\..*)?\.config\.ts$''',
	'''^apps/api/vitest(\..*)?\.config\.ts$''',
	# 個別のテストファイル (*.test.ts)
	'''.*\.test\.ts$''',
]

[[allowlists]]
description = "API 仕様ドキュメント内の JWT/OAuth トークン形式サンプルは本物の機密ではないため除外"
paths = [
	'''^apps/docs/src/content/docs/.*\.mdx$''',
]

[[allowlists]]
description = ".env.template はプレースホルダ値のみで本物の機密ではないため除外"
paths = [
	'''(^|/)\.env\.template$''',
]
