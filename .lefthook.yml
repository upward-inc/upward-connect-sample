# lefthook 本体を解決できないとき、警告のみで通さず hook を失敗させる
assert_lefthook_installed: true

# 各 job は `mise exec <ツール名> --` のように、使うツールを明示して呼ぶ。
# ツール名を省くと、hook と関係のないツールも含めて `mise.toml` の未導入のツールがすべて取得の対象になるため。

post-checkout:
  jobs:
    # ブランチ切替で依存ファイルが変わっていたら `bun install` を実施
    - name: sync-deps
      run: |
        prev="{1}"
        next="{2}"
        flag="{3}"
        # ファイル checkout / 同一 SHA / 初回 clone はスキップ
        if [ "$flag" != "1" ] || [ "$prev" = "$next" ] || [ "$prev" = "0000000000000000000000000000000000000000" ]; then
          exit 0
        fi
        if git diff --name-only "$prev" "$next" 2>/dev/null | grep -qE '^(package\.json|bun\.lock|apps/[^/]+/package\.json)$'; then
          mise exec bun -- bun install
        fi

    # ブランチ切替で Prisma スキーマが変わっていたら Prisma Client を生成し直す
    # 古い生成物のままだと、pre-commit の型チェックが新しいスキーマに合わない型を読んで失敗する
    # 生成に失敗しても hook は成功扱いにする（checkout の終了コードを失敗にしない）
    - name: sync-prisma-client
      run: |
        prev="{1}"
        next="{2}"
        flag="{3}"
        if [ "$flag" != "1" ] || [ "$prev" = "$next" ] || [ "$prev" = "0000000000000000000000000000000000000000" ]; then
          exit 0
        fi
        if git diff --name-only "$prev" "$next" 2>/dev/null | grep -qE '^apps/backend/prisma/schema\.prisma$'; then
          if ! mise exec bun -- bun run prisma#generate; then
            echo "prisma#generate failed (see above); continuing checkout" >&2
          fi
        fi
        exit 0

post-merge:
  jobs:
    # マージ / pull で依存ファイルが変わっていたら `bun install` を実施
    - name: sync-deps
      files: git diff --name-only ORIG_HEAD HEAD
      glob:
        - "package.json"
        - "bun.lock"
        - "apps/*/package.json"
      run: mise exec bun -- bun install

    # マージ / pull で Prisma スキーマが変わっていたら Prisma Client を生成し直す
    # 生成に失敗しても hook は成功扱いにする
    - name: sync-prisma-client
      files: git diff --name-only ORIG_HEAD HEAD
      glob:
        - "apps/backend/prisma/schema.prisma"
      run: |
        if ! mise exec bun -- bun run prisma#generate; then
          echo "prisma#generate failed (see above); continuing" >&2
        fi
        exit 0

pre-commit:
  parallel: true
  jobs:
    # コミット前にコード整形と型チェックを直列で実施
    - name: format-and-check
      group:
        piped: true
        jobs:
          - name: lint
            glob: "*.{ts,tsx,js,jsx}"
            exclude:
              - "**/prisma/generated/**"
              - "**/routeTree.gen.ts"
            run: mise exec bun -- bun run biome lint --write {staged_files}
            stage_fixed: true
          - name: format
            glob: "*.{ts,tsx,js,jsx}"
            exclude:
              - "**/prisma/generated/**"
              - "**/routeTree.gen.ts"
            run: mise exec bun -- bun run biome format --write {staged_files}
            stage_fixed: true
          # 変更のあった app と scripts/ の型チェックを実施
          #
          # lint / format がファイルを書き換えるため、並行実行すると型チェックが整形中のファイルを読みうる。
          # 整形の後に置く。
          #
          # 型チェックが読むのはステージした内容ではなく作業ツリー。
          # ステージした内容だけを検査するには一時ディレクトリへの取り出しが必要で、pre-commit の目的に対して過剰。
          #
          # glob の `*` はディレクトリ区切りを跨ぐため、`apps/backend/*.ts` で直下と配下の両方が対象になる。
          # `**` はディレクトリを 0 個含む形にマッチせず、直下のファイルを取りこぼす。
          - name: backend-typecheck
            glob:
              - "apps/backend/*.ts"
              - "apps/backend/tsconfig.json"
            exclude:
              - "**/prisma/generated/**"
            run: mise exec bun -- bun run --filter backend typecheck
          - name: frontend-typecheck
            glob:
              - "apps/frontend/*.{ts,tsx}"
              - "apps/frontend/tsconfig*.json"
            exclude:
              - "**/routeTree.gen.ts"
            run: mise exec bun -- bun run --filter frontend typecheck
          # scripts/ は app ではないため、ルートの scripts#typecheck で型チェックする
          - name: scripts-typecheck
            glob:
              - "scripts/*.ts"
              - "scripts/tsconfig.json"
            run: mise exec bun -- bun run scripts#typecheck

    # コミット前にステージ済みファイルに機密情報が含まれていないかを検証
    - name: gitleaks
      run: mise exec gitleaks -- gitleaks git --pre-commit --staged --redact --no-banner --verbose

pre-push:
  parallel: true
  jobs:
    # Push 前に依存定義 (package.json / bun.lock) が変わっていたら `bun install` 起因の `bun.lock` 更新漏れ検知を実施
    - name: bun-lockfile-drift
      glob:
        - "package.json"
        - "bun.lock"
        - "apps/*/package.json"
      run: |
        set -euo pipefail
        if ! mise exec bun -- bun install --ignore-scripts; then
          echo ""
          echo "mise exec bun -- bun install --ignore-scripts failed; cannot verify bun.lock drift"
          echo "See the error output above for details"
          exit 1
        fi
        if ! git diff --quiet -- bun.lock; then
          echo ""
          echo "bun.lock is out of sync"
          git --no-pager diff --stat -- bun.lock
          echo ""
          echo "Commit the updated bun.lock and push again"
          exit 1
        fi

    # Push 前にルート定義が変わっていたら `routeTree.gen.ts` のコミット漏れ検知を実施
    - name: tanstack-routes-drift
      glob: "apps/frontend/src/routes/**"
      run: |
        set -euo pipefail
        if ! mise exec bun -- bun run fe#build; then
          echo ""
          echo "mise exec bun -- bun run fe#build failed; cannot verify apps/frontend/src/routeTree.gen.ts drift"
          echo "See the error output above for details"
          exit 1
        fi
        if ! git diff --quiet -- apps/frontend/src/routeTree.gen.ts; then
          echo ""
          echo "apps/frontend/src/routeTree.gen.ts is out of sync"
          git --no-pager diff --stat -- apps/frontend/src/routeTree.gen.ts
          echo ""
          echo "Commit the regenerated apps/frontend/src/routeTree.gen.ts and push again"
          exit 1
        fi