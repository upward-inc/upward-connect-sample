name: frontend deploy - staging

on:
  # stagingブランチへのPush時（PRマージ時）
  push:
    branches:
      - staging
    paths:
      - 'apps/frontend/**'
      - '.github/workflows/frontend_deploy_staging.yml'
      - '.github/workflows/call_frontend_*.yml'

  # stagingブランチへのPR操作時（closed含む：プレビュー環境削除のため）
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - staging
    paths:
      - 'apps/frontend/**'
      - '.github/workflows/frontend_deploy_staging.yml'
      - '.github/workflows/call_frontend_*.yml'

  # 手動トリガー
  workflow_dispatch:

# 同一ブランチでの重複実行を制御
# - PR操作時: 古い実行をキャンセルして最新のみ実行
#   - closedイベントはキャンセル対象外（プレビュー環境削除のみのため、キャンセルしない）
# - Push時: キャンセルせず順番に実行（デプロイの安全性確保）
concurrency:
  group: frontend-deploy-staging-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}

jobs:
  # コード品質チェック
  lint:
    if: github.event.action != 'closed'
    permissions:
      contents: read
    uses: ./.github/workflows/call_frontend_lint.yml
    with:
      target: 'frontend'

  # ユニットテスト実行
  test:
    if: github.event.action != 'closed'
    permissions:
      contents: read
    uses: ./.github/workflows/call_frontend_test.yml
    with:
      target: 'frontend'

  # フロントエンドのビルド
  build:
    if: github.event.action != 'closed'
    needs: [lint, test]
    permissions:
      contents: read
    uses: ./.github/workflows/call_frontend_build.yml
    with:
      environment: 'staging'
      target: 'frontend'

  # Azure Static Web Appsへのデプロイ
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/call_frontend_deploy.yml
    with:
      environment: 'staging'
    secrets:
      AZURE_STATIC_WEB_APPS_DEPLOY_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_DEPLOY_TOKEN }}

  # プレビュー環境の削除
  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/call_frontend_close_pull_request.yml
    with:
      environment: 'staging'
    secrets:
      AZURE_STATIC_WEB_APPS_DEPLOY_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_DEPLOY_TOKEN }}
