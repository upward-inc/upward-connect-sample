name: call backend build

on:
  workflow_call:
    inputs:
      environment:
        description: '環境名'
        required: true
        type: string
      registry_domain:
        description: 'コンテナレジストリ'
        required: true
        type: string
      repository_name:
        description: 'コンテナリポジトリ名'
        required: true
        type: string
      tag:
        description: 'コンテナイメージのタグ'
        required: true
        type: string
      dockerfile_path:
        description: 'Dockerfileのパス'
        required: true
        type: string
      context_path:
        description: 'ビルドコンテキストのパス'
        required: true
        type: string
    secrets:
      CONTAINER_REGISTRY_USERNAME:
        description: 'コンテナレジストリのユーザー名'
        required: true
      CONTAINER_REGISTRY_PASSWORD:
        description: 'コンテナレジストリのパスワード'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout to the branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to container registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ inputs.registry_domain }}
          username: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
          password: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          push: true
          tags: ${{ inputs.registry_domain }}/${{ inputs.repository_name }}:${{ inputs.tag }}
          file: ${{ inputs.dockerfile_path }}
          context: ${{ inputs.context_path }}
          build-args: |
            ENV_NAME=${{ inputs.environment }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
