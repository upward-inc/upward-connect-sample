name: call backend build

on:
  workflow_call:
    inputs:
      environment:
        description: '環境名'
        required: true
        type: string
      registry_domain:
        description: 'コンテナレジストリ'
        required: true
        type: string
      repository_name:
        description: 'コンテナリポジトリ名'
        required: true
        type: string
      tag:
        description: 'コンテナイメージのタグ'
        required: true
        type: string
      dockerfile_path:
        description: 'Dockerfileのパス'
        required: true
        type: string
      context_path:
        description: 'ビルドコンテキストのパス'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout to the branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ inputs.registry_domain }}
          username: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
          password: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          push: true
          tags: ${{ inputs.registry_domain }}/${{ inputs.repository_name }}:${{ inputs.tag }}
          file: ${{ inputs.dockerfile_path }}
          context: ${{ inputs.context_path }}
          build-args: |
            ENV_NAME=${{ inputs.environment }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
