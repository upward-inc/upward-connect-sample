name: call frontend lint

on:
  workflow_call:
    inputs:
      target:
        description: '対象アプリ'
        required: true
        type: string

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.12

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ inputs.target }}-${{ hashFiles( format('apps/{0}/bun.lock', inputs.target) ) }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ inputs.target }}-

      - name: Install dependencies
        working-directory: ./apps/${{ inputs.target }}
        run: bun install --frozen-lockfile

      - name: Lint
        working-directory: ./apps/${{ inputs.target }}
        run: bun run lint
