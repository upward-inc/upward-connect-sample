name: Create Staging to Main Pull Request
on:
  push:
    branches: [ staging ]

concurrency:
  group: create-release-pr-s2m-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-pull-request:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: staging
          persist-credentials: false
      - name: Use ruby
        uses: ruby/setup-ruby@6aaa311d81eba98ae12eaffbcb63296ace0efcde # v1.307.0
        with:
          ruby-version: 3.1
      - name: Install git-pr-release
        run: gem install --no-document git-pr-release
      - name: Generate token
        id: generate_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GIT_PR_RELEASE_APP_ID }}
          private-key: ${{ secrets.GIT_PR_RELEASE_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write
      - name: Configure git authentication
        env:
          TOKEN: ${{ steps.generate_token.outputs.token }}
        run: |
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
      - name: Set up environment variables
        env:
          TZ: 'Asia/Tokyo'
        run: |
          echo "PR_TITLE=release - main: $(date '+%Y-%m-%d')" >> "$GITHUB_ENV"
      - name: Run
        run: git-pr-release --squashed
        env:
          GIT_PR_RELEASE_TOKEN: ${{ steps.generate_token.outputs.token }}
          GIT_PR_RELEASE_BRANCH_PRODUCTION: main
          GIT_PR_RELEASE_BRANCH_STAGING: staging
          GIT_PR_RELEASE_LABELS: release
          GIT_PR_RELEASE_TEMPLATE: .github/workflows/git-pr-release.erb
          PR_TITLE: ${{ env.PR_TITLE }}
          TZ: Asia/Tokyo
