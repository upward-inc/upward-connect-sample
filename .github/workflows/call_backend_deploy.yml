name: call backend deploy

on:
  workflow_call:
    inputs:
      environment:
        description: '環境名'
        required: true
        type: string
      container_app_name:
        description: 'コンテナアプリ名'
        required: true
        type: string
      resource_group:
        description: 'リソースグループ'
        required: true
        type: string
      registry_domain:
        description: 'コンテナレジストリ'
        required: true
        type: string
      repository_name:
        description: 'コンテナリポジトリ名'
        required: true
        type: string
      tag:
        description: 'コンテナイメージのタグ'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Azure Login
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          creds: ${{ secrets.DEPLOY_APP_CREDENTIALS }}

      - name: Deploy to containerapp
        uses: azure/CLI@9f7ce6f37c31b777ec6c6b6d1dfe7db79f497956 # v2.2.0
        with:
          inlineScript: |
            az config set extension.use_dynamic_install=yes_without_prompt
            az containerapp registry set -n ${{ inputs.container_app_name }} -g ${{ inputs.resource_group }} --server ${{ inputs.registry_domain }} --username ${{ secrets.CONTAINER_REGISTRY_USERNAME }} --password ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}
            az containerapp update -n ${{ inputs.container_app_name }} -g ${{ inputs.resource_group }} --image ${{ inputs.registry_domain }}/${{ inputs.repository_name }}:${{ inputs.tag }} --revision-suffix rev-$(date +'%Y%m%d%H%M%S')
