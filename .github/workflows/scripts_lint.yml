name: scripts lint

# required status check に登録するため、on.paths で絞らず対象ブランチ宛の全 PR で発火させる。
# on.paths で絞ると、一致しない PR で発火せず Expected のまま止まり merge できなくなる。
on:
  pull_request:
    branches: [develop, staging, main]

# 同一 PR で push が続いたとき、古い実行をキャンセルして最新のみ走らせる
concurrency:
  group: scripts-lint-${{ github.ref }}
  cancel-in-progress: true

# scripts/ の Biome は pre-commit の lefthook で検査しており、CI での検査はまだ入れていない。
jobs:
  # job 名は required status check の context 名になるため、リポジトリ内で一意にする
  typecheck:
    name: Scripts Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      # bun のキャッシュは置かない。
      # このジョブは PR でしか動かず develop にキャッシュを保存しないため、PR で保存したキャッシュはほかの PR から使えず、容量を圧迫するだけになる。
      # 型チェックに要る @types/bun と typescript を入れる。
      # ルートの postinstall（lefthook の導入と Prisma Client の生成）は型チェックに要らないため走らせない。
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: bun run scripts#typecheck
