name: call static web build

on:
  workflow_call:
    inputs:
      environment:
        description: '環境名'
        required: true
        type: string
      target:
        description: '対象プロダクト'
        required: true
        type: string

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.12

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ inputs.target }}-${{ hashFiles( format('apps/{0}/bun.lock', inputs.target) ) }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ inputs.target }}-

      - name: Install dependencies
        working-directory: ./apps/${{ inputs.target }}
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: ./apps/${{ inputs.target }}
        env:
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          echo "$VARS_JSON" | jq -r 'to_entries[] | "\(.key)=\(.value)"' > .env
          bun run build
          rm -f .env
          cp ../../staticwebapp.config.json ./dist

      - name: Upload Publish Files
        uses: actions/upload-artifact@v4
        with:
          name: publish-files
          path: ./apps/${{ inputs.target }}/dist
          retention-days: 1