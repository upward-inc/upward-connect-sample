name: Security Alert

on:
  schedule:
    # リポジトリでのアラート生成タイミングに合わせる
    - cron: "10 22 * * 0-4" # 平日 7:10 JST

  # テスト用
  workflow_dispatch:

jobs:
  dependabot:
    uses: upward-inc/github-foundation/.github/workflows/dependabot-security-alert.yml@main
    # 共有ワークフローの Webhook を送る job が contents: write を宣言している。
    # 呼び出し側がそれより狭い権限しか与えないと、Webhook を使わなくても起動時の検査で startup_failure になる。
    permissions:
      contents: write
    secrets:
      UPWARD_SHARED_WORKFLOWS_APP_ID: ${{ vars.UPWARD_SHARED_WORKFLOWS_APP_ID }}
      UPWARD_SHARED_WORKFLOWS_APP_PRIVATE_KEY: ${{ secrets.UPWARD_SHARED_WORKFLOWS_APP_PRIVATE_KEY }}
      SLACK_DEVOPS_BOT_TOKEN: ${{ secrets.SLACK_DEVOPS_BOT_TOKEN }}
      EVENT_WEBHOOK_URL: https://api.github.com/repos/${{ github.repository }}/dispatches
      EVENT_WEBHOOK_HEADERS: |
        Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: 2022-11-28
    with:
      slack-channel: ${{ vars.SECURITY_ALERT_SLACK_CHANNEL_ID }}
      slack-severity: ${{ vars.SECURITY_ALERT_SEVERITY }}
      # slack-mentions は渡さない。通知されるアラートが多く、通知ごとにメンションすると煩わしいため。
      # 人の対応が要る自動起票の失敗の通知にだけ、メンションを付ける（受け口 .github/workflows/security-alert-intake.yml の input slack-mentions）。
      # 起票したアラートが必ず Slack にも通知され、そのスレッドに Issue へのリンクを返信できるよう、slack-severity と同じ variable を渡す
      webhook-severity: ${{ vars.SECURITY_ALERT_SEVERITY }}

  code-scanning:
    uses: upward-inc/github-foundation/.github/workflows/code-scanning-security-alert.yml@main
    # 共有ワークフローの Webhook を送る job が contents: write を宣言している。
    # 呼び出し側がそれより狭い権限しか与えないと、Webhook を使わなくても起動時の検査で startup_failure になる。
    permissions:
      contents: write
    secrets:
      UPWARD_SHARED_WORKFLOWS_APP_ID: ${{ vars.UPWARD_SHARED_WORKFLOWS_APP_ID }}
      UPWARD_SHARED_WORKFLOWS_APP_PRIVATE_KEY: ${{ secrets.UPWARD_SHARED_WORKFLOWS_APP_PRIVATE_KEY }}
      SLACK_DEVOPS_BOT_TOKEN: ${{ secrets.SLACK_DEVOPS_BOT_TOKEN }}
      EVENT_WEBHOOK_URL: https://api.github.com/repos/${{ github.repository }}/dispatches
      EVENT_WEBHOOK_HEADERS: |
        Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: 2022-11-28
    with:
      slack-channel: ${{ vars.SECURITY_ALERT_SLACK_CHANNEL_ID }}
      slack-severity: ${{ vars.SECURITY_ALERT_SEVERITY }}
      # slack-mentions は渡さない。通知されるアラートが多く、通知ごとにメンションすると煩わしいため。
      # 人の対応が要る自動起票の失敗の通知にだけ、メンションを付ける（受け口 .github/workflows/security-alert-intake.yml の input slack-mentions）。
      # 起票したアラートが必ず Slack にも通知され、そのスレッドに Issue へのリンクを返信できるよう、slack-severity と同じ variable を渡す
      webhook-severity: ${{ vars.SECURITY_ALERT_SEVERITY }}
