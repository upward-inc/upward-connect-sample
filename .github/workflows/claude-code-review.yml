name: Claude Code Review

on:
  pull_request:
    types: [ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@fd1c128679612beff4ca259c78021c506e8aa7a7 # v1.0.237
        with:
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}

          # Enable progress tracking
          track_progress: true

          # Your custom review instructions
          prompt: |
            `docs/development/review-criteria.md` に定義されたレビュー基準に従い、このプルリクエストを日本語でレビューしてください

            [MUST]
            - 修正や確認が必要な箇所については、その重要度に関わらず、ファイルまたは行レベルのインラインコメントとして指摘してください

            [MUST NOT]
            - 修正や確認が必要な箇所については、その重要度に関わらず、トップレベルにコメントしないでください
              - トップレベルでコメントされると、指摘事項がどのように対処されたのか第三者が把握しにくくなる等の問題が発生するため

            [MAY]
            - 称賛する点があればトップレベルにコメントしてください

          # Tools for comprehensive PR review
          claude_args: |
            --allowed-tools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(bun run:*)"
