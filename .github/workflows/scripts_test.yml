name: scripts test

# PR では単独で走り、required status check の対象になる。
# develop での送信時は Dependency submission から workflow_call で呼ばれる。
# required に登録するため on.paths で絞らず、変更パスの判定は job 内で行う。
on:
  workflow_call:

  pull_request:
    branches: [develop, staging, main]

# 送信側は push 実行を cancel-in-progress: false にして、進行中の送信を途中でキャンセルしない保証をしている。
# ここを無条件 true にすると呼び出し元からの実行でその保証が壊れるため、PR イベント時のみキャンセルする。
concurrency:
  group: scripts-test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # job 名は required status check の context 名になるため、リポジトリ内で一意にする
  test:
    name: Scripts Test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # dorny/paths-filter が pull_request イベントで変更ファイル一覧を API から取得するために要る。
      # 呼ばれた側は呼び出し元より広い権限を要求できず、超えるとワークフローが起動時に失敗する。
      # workflow_call で呼ぶ側にも同じ権限を持たせること。
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # フィルタ定義をチェックアウト済みのワークツリーから読むため、この判定は checkout の直後に置く。
      - name: Detect relevant changes
        id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/check-filters.yaml

      # 以降の step は、変更が scripts_test に該当しない PR で skip し、job を success で終える。
      # pull_request 以外では判定 step が skip されて出力が無いため、前段の条件で短絡させて全実行にする。
      # != 'false' はフィルタ名の打ち間違いで出力が空文字になったときに fail-open にするため。
      # テストと dry-run は Bun の組み込みだけを使うため、依存のインストールは要らない。
      - name: Setup Bun
        if: github.event_name != 'pull_request' || steps.changes.outputs.scripts_test != 'false'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Test
        if: github.event_name != 'pull_request' || steps.changes.outputs.scripts_test != 'false'
        run: bun run scripts#test

      # bun.lock の形が変わって送れなくなったことを、develop で送る前に知るため、実際の bun.lock を読んで送る前の検査で止まらないことを確かめる。
      # GITHUB_SHA などの環境変数は Actions が設定する。
      - name: Dry run dependency submission
        if: github.event_name != 'pull_request' || steps.changes.outputs.scripts_test != 'false'
        run: bun run deps#submit -- --dry-run > /dev/null
