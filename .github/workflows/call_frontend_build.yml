name: call frontend build

on:
  workflow_call:
    inputs:
      environment:
        description: '環境名'
        required: true
        type: string
      target:
        description: '対象アプリ'
        required: true
        type: string

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ inputs.target }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ inputs.target }}-

      - name: Install dependencies
        working-directory: ./apps/${{ inputs.target }}
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: ./apps/${{ inputs.target }}
        env:
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          echo "$VARS_JSON" | jq -r 'to_entries[] | "\(.key)=\(.value)"' > .env
          bun run build
          rm -f .env
          cp ../../staticwebapp.config.json ./dist

      - name: Upload Publish Files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publish-files
          path: ./apps/${{ inputs.target }}/dist
          retention-days: 1
