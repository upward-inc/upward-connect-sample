name: docs deploy - develop

on:
  # developブランチへのPush時（PRマージ時）
  push:
    branches:
      - develop
    paths:
      - 'apps/docs/**'
      - '.github/workflows/docs_deploy_develop.yml'
      - '.github/workflows/call_frontend_*.yml'

  # developブランチへのPR操作時（closed含む：プレビュー環境削除のため）
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - develop
    paths:
      - 'apps/docs/**'
      - '.github/workflows/docs_deploy_develop.yml'
      - '.github/workflows/call_frontend_*.yml'

  # 手動トリガー
  workflow_dispatch:

# 同一ブランチでの重複実行を制御
# - PR操作時: 古い実行をキャンセルして最新のみ実行
# - Push時: キャンセルせず順番に実行（デプロイの安全性確保）
concurrency:
  group: docs-deploy-develop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # コード品質チェック
  lint:
    if: github.event.action != 'closed'
    uses: ./.github/workflows/call_frontend_lint.yml
    with:
      target: 'docs'

  # フロントエンドのビルド
  build:
    if: github.event.action != 'closed'
    needs: [lint]
    uses: ./.github/workflows/call_frontend_build.yml
    with:
      environment: 'develop'
      target: 'docs'

  # Azure Static Web Appsへのデプロイ
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    uses: ./.github/workflows/call_frontend_deploy.yml
    with:
      environment: 'develop'
    secrets:
      AZURE_STATIC_WEB_APPS_DEPLOY_TOKEN: ${{ secrets.DOCS_AZURE_STATIC_WEB_APPS_DEPLOY_TOKEN }}

  # プレビュー環境の削除
  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    uses: ./.github/workflows/call_frontend_close_pull_request.yml
    with:
      environment: 'develop'
    secrets:
      AZURE_STATIC_WEB_APPS_DEPLOY_TOKEN: ${{ secrets.DOCS_AZURE_STATIC_WEB_APPS_DEPLOY_TOKEN }}
