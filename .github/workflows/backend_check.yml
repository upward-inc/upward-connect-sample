name: backend check

on:
  # mainブランチへのPush時（PRマージ時）
  push:
    branches:
      - main
    paths:
      - 'apps/backend/**'
      - '.github/workflows/backend_check.yml'
      - '.github/workflows/call_backend_*.yml'

  # mainブランチへのPR操作時
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - 'apps/backend/**'
      - '.github/workflows/backend_check.yml'
      - '.github/workflows/call_backend_*.yml'

  # 手動トリガー
  workflow_dispatch:

# 同一ブランチでの重複実行を制御
concurrency:
  group: backend-deploy-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # コード品質チェック
  lint:
    uses: ./.github/workflows/call_backend_lint.yml

  # ユニットテスト実行
  test:
    uses: ./.github/workflows/call_backend_test.yml

  # Dockerイメージのビルド
  build:
    needs: [lint, test]
    uses: ./.github/workflows/call_backend_build.yml
    with:
      dockerfile_path: './apps/backend/Dockerfile'
      context_path: './apps/backend'
    secrets: inherit
