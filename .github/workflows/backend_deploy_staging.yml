name: backend deploy - staging

on:
  # stagingブランチへのPush時（PRマージ時）
  push:
    branches:
      - staging
    paths:
      - 'apps/backend/**'
      - '.github/workflows/backend_deploy_staging.yml'
      - '.github/workflows/call_backend_*.yml'

  # stagingブランチへのPR操作時
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - staging
    paths:
      - 'apps/backend/**'
      - '.github/workflows/backend_deploy_staging.yml'
      - '.github/workflows/call_backend_*.yml'

  # 手動トリガー
  workflow_dispatch:

# 同一ブランチでの重複実行を制御
# - PR操作時: 古い実行をキャンセルして最新のみ実行
# - Push時: キャンセルせず順番に実行（デプロイの安全性確保）
concurrency:
  group: backend-deploy-staging-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # コード品質チェック
  lint:
    permissions:
      contents: read
    uses: ./.github/workflows/call_backend_lint.yml

  # ユニットテスト実行
  test:
    permissions:
      contents: read
    uses: ./.github/workflows/call_backend_test.yml

  # Dockerイメージのビルド/プッシュ
  build:
    needs: [lint, test]
    permissions:
      contents: read
    uses: ./.github/workflows/call_backend_build.yml
    with:
      environment: 'staging'
      registry_domain: 'connectsamplestgjecr01.azurecr.io'
      repository_name: 'connect-sample-backend-01'
      tag: 'latest'
      dockerfile_path: './apps/backend/Dockerfile'
      context_path: './apps/backend'
    secrets:
      CONTAINER_REGISTRY_USERNAME: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
      CONTAINER_REGISTRY_PASSWORD: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}

  # Azure Container Appsへのデプロイ
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      contents: read
    uses: ./.github/workflows/call_backend_deploy.yml
    with:
      environment: 'staging'
      container_app_name: 'connect-sample-stg-je-ca-01'
      resource_group: 'connect-sample-stg-je'
      registry_domain: 'connectsamplestgjecr01.azurecr.io'
      repository_name: 'connect-sample-backend-01'
      tag: 'latest'
    secrets:
      DEPLOY_APP_CREDENTIALS: ${{ secrets.DEPLOY_APP_CREDENTIALS }}
      CONTAINER_REGISTRY_USERNAME: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
      CONTAINER_REGISTRY_PASSWORD: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}
