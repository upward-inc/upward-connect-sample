name: backend deploy - develop

on:
  push:
    branches:
      - develop
    paths:
      - 'apps/backend/**'
      - '.github/workflows/backend_deploy_develop.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - develop
  # 手動トリガーを許可
  workflow_dispatch:

jobs:
  lint:
    uses: ./.github/workflows/call_backend_lint.yml

  test:
    uses: ./.github/workflows/call_backend_test.yml

  build:
    needs: [lint, test]
    uses: ./.github/workflows/call_backend_build.yml
    with:
      environment: 'develop'
      registry_domain: 'connectsampledevjecr01.azurecr.io'
      repository_name: 'connect-sample-backend-01'
      tag: 'latest'
      dockerfile_path: './apps/backend/Dockerfile'
      context_path: './apps/backend'
    secrets: inherit

  deploy:
    # PRの場合はdeployをスキップ
    if: github.event_name != 'pull_request'
    needs: build
    uses: ./.github/workflows/call_backend_deploy.yml
    with:
      environment: 'develop'
      container_app_name: 'connect-sample-dev-je-api-01'
      resource_group: 'connect-sample-dev-je'
      registry_domain: 'connectsampledevjecr01.azurecr.io'
      repository_name: 'connect-sample-backend-01'
      tag: 'latest'
    secrets: inherit