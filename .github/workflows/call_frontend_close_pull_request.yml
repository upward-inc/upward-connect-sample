name: call frontend close pull request

on:
  workflow_call:
    inputs:
      environment:
        description: '環境名'
        required: true
        type: string
    secrets:
      AZURE_STATIC_WEB_APPS_DEPLOY_TOKEN:
        description: 'Azure Static Web Apps デプロイ用トークン'
        required: true

jobs:
  close_pull_request:
    name: Close Pull Request
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_DEPLOY_TOKEN }}
          action: 'close'
          app_location: '/dist'
