name: call api lint

on:
  workflow_call:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.12

      - name: Install dependencies
        working-directory: ./apps/backend
        run: bun install --frozen-lockfile

      - name: Lint
        working-directory: ./apps/backend
        run: bun run lint
