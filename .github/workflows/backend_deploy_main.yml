name: backend deploy - main

on:
  # mainブランチへのPush時（PRマージ時）
  push:
    branches:
      - main
    paths:
      - 'apps/backend/**'
      - '.github/workflows/backend_deploy_main.yml'
      - '.github/workflows/call_backend_*.yml'

  # mainブランチへのPR操作時
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - 'apps/backend/**'
      - '.github/workflows/backend_deploy_main.yml'
      - '.github/workflows/call_backend_*.yml'

  # 手動トリガー
  workflow_dispatch:

# 同一ブランチでの重複実行を制御
# - PR操作時: 古い実行をキャンセルして最新のみ実行
# - Push時: キャンセルせず順番に実行（デプロイの安全性確保）
concurrency:
  group: backend-deploy-main-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # コード品質チェック
  lint:
    uses: ./.github/workflows/call_backend_lint.yml

  # ユニットテスト実行
  test:
    uses: ./.github/workflows/call_backend_test.yml

  # Dockerイメージのビルド/プッシュ
  build:
    needs: [lint, test]
    uses: ./.github/workflows/call_backend_build.yml
    with:
      environment: 'main'
      registry_domain: 'connectsampleprodjecr01.azurecr.io'
      repository_name: 'connect-sample-backend-01'
      tag: 'latest'
      dockerfile_path: './apps/backend/Dockerfile'
      context_path: './apps/backend'
    secrets: inherit

  # Azure Container Appsへのデプロイ
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    uses: ./.github/workflows/call_backend_deploy.yml
    with:
      environment: 'main'
      container_app_name: 'connect-sample-prod-je-ca-01'
      resource_group: 'connect-sample-prod-je'
      registry_domain: 'connectsampleprodjecr01.azurecr.io'
      repository_name: 'connect-sample-backend-01'
      tag: 'latest'
    secrets: inherit
