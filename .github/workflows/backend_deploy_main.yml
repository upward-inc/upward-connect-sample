name: backend deploy - main

on:
  # mainブランチへのPush時（PRマージ時）
  push:
    branches:
      - main
    paths:
      - 'apps/backend/**'
      - '.github/workflows/backend_deploy_main.yml'
      - '.github/workflows/call_backend_*.yml'
      - '.github/workflows/backend_test.yml'

  # mainブランチへのPR操作時
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - 'apps/backend/**'
      - '.github/workflows/backend_deploy_main.yml'
      - '.github/workflows/call_backend_*.yml'
      - '.github/workflows/backend_test.yml'

  # 手動トリガー
  workflow_dispatch:

# 同一ブランチでの重複実行を制御
# - PR操作時: 古い実行をキャンセルして最新のみ実行
# - Push時: キャンセルせず順番に実行（デプロイの安全性確保）
concurrency:
  group: backend-deploy-main-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ユニットテスト実行
  # PR 時は backend_test.yml が単独で走るため、ここでも実行すると同じテストが二重に動く。
  # lint と型チェックは backend_lint.yml が PR 時にだけ実行する。
  test:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      # backend_test.yml が dorny/paths-filter のために要求する。
      # 呼ばれた側は呼び出し元より広い権限を持てず、渡さないとワークフローが起動時に失敗する。
      pull-requests: read
    uses: ./.github/workflows/backend_test.yml

  # Dockerイメージのビルド/プッシュ
  # PR 時は test が skipped になるため、skipped でも進める。
  build:
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    needs: test
    permissions:
      contents: read
    uses: ./.github/workflows/call_backend_build.yml
    with:
      environment: 'main'
      registry_domain: 'connectsampleprodjecr01.azurecr.io'
      repository_name: 'connect-sample-backend-01'
      tag: ${{ github.sha }}
      additional_tag: 'latest'
      # PR ではビルドの確認だけを行い、マージ前のイメージをレジストリに置かない
      push: ${{ github.event_name != 'pull_request' }}
      dockerfile_path: './apps/backend/Dockerfile'
      context_path: './apps/backend'
    secrets:
      CONTAINER_REGISTRY_USERNAME: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
      CONTAINER_REGISTRY_PASSWORD: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}

  # Azure Container Appsへのデプロイ
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      contents: read
    uses: ./.github/workflows/call_backend_deploy.yml
    with:
      environment: 'main'
      container_app_name: 'connect-sample-prod-je-ca-01'
      resource_group: 'connect-sample-prod-je'
      registry_domain: 'connectsampleprodjecr01.azurecr.io'
      repository_name: 'connect-sample-backend-01'
      tag: ${{ github.sha }}
    secrets:
      DEPLOY_APP_CREDENTIALS: ${{ secrets.DEPLOY_APP_CREDENTIALS }}
      CONTAINER_REGISTRY_USERNAME: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
      CONTAINER_REGISTRY_PASSWORD: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}
