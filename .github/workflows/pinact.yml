name: pinact
on: [pull_request]
permissions:
  contents: read
jobs:
  pinact:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify dependencies sha pinning with pinact
        uses: suzuki-shunsuke/pinact-action@cf51507d80d4d6522a07348e3d58790290eaf0b6 # v2.0.0
        with:
          skip_push: true # Validationのみ、PRにコミットを追加しない
          verify: true
          min_age: "7" # cooldownの期間を7日に設定（dependabot.ymlと合わせる）
