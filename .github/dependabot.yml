version: 2
updates:
  # ルートディレクトリのnpm依存関係
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    cooldown:
      default-days: 7

  # backend ワークスペース
  - package-ecosystem: "bun"
    directory: "/apps/backend"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps(backend)"
    cooldown:
      default-days: 7

  # frontend ワークスペース
  - package-ecosystem: "bun"
    directory: "/apps/frontend"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps(frontend)"
    cooldown:
      default-days: 7

  # docs ワークスペース
  - package-ecosystem: "bun"
    directory: "/apps/docs"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps(docs)"
    cooldown:
      default-days: 7

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps(github-actions)"
    cooldown:
      default-days: 7
