version: 2
updates:
  # ルートディレクトリ
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "daily"
      time: "07:00"
      timezone: "Asia/Tokyo"
    target-branch: "develop"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 999

  # backend ワークスペース
  - package-ecosystem: "bun"
    directory: "/apps/backend"
    schedule:
      interval: "daily"
      time: "07:00"
      timezone: "Asia/Tokyo"
    target-branch: "develop"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps(backend)"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 999

  # frontend ワークスペース
  - package-ecosystem: "bun"
    directory: "/apps/frontend"
    schedule:
      interval: "daily"
      time: "07:00"
      timezone: "Asia/Tokyo"
    target-branch: "develop"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps(frontend)"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 999

  # docs ワークスペース
  - package-ecosystem: "bun"
    directory: "/apps/docs"
    schedule:
      interval: "daily"
      time: "07:00"
      timezone: "Asia/Tokyo"
    target-branch: "develop"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps(docs)"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 999

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "07:00"
      timezone: "Asia/Tokyo"
    target-branch: "develop"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps(github-actions)"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 999
    # upward-inc/triage-to-linear は internal リポジトリで Dependabot から到達できない。
    # 到達できないと更新チェックが失敗し、github-actions の更新の job 全体が error 終了する。
    # SHA で参照しており、版は手で上げる（.github/workflows/security-alert-intake.yml のコメント）。
    # reusable workflow の依存名は owner/repo にワークフローファイルのパスまで含む形になるため、パターンもパスを含めて書く。
    # dependency-name は ref を条件に取れないため、参照の形を変えるときはこの ignore も見直す。
    ignore:
      - dependency-name: "upward-inc/triage-to-linear/.github/workflows/*"
